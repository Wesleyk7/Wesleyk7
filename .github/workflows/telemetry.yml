name: Update profile telemetry

on:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"
  push:
    branches: [main]
    paths:
      - "scripts/generate_telemetry.py"
      - ".github/workflows/telemetry.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Generate telemetry SVG
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: Wesleyk7
        run: python scripts/generate_telemetry.py

      - name: Commit updated SVG
        run: |
          if git diff --quiet -- assets/telemetry.svg; then
            echo "No telemetry changes."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/telemetry.svg
          git commit -m "chore: update profile telemetry"
          git push
